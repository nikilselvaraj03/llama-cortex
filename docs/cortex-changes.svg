<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="820" viewBox="0 0 1240 820" font-family="ui-sans-serif, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#94a3b8"/>
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb"/>
    </marker>
  </defs>

  <rect width="1240" height="820" fill="#ffffff"/>

  <text x="40" y="48" font-size="26" font-weight="700" fill="#0f172a">llama-cortex</text>
  <text x="252" y="48" font-size="15" fill="#64748b">— inference path, and where each change sits</text>
  <text x="40" y="72" font-size="12.5" fill="#94a3b8">blue = changed in this fork · grey = upstream path · numbers are measured on M1 Pro, Gemma-3-1B Q4_0</text>

  <!-- ============ ROW 1: pipeline ============ -->
  <text x="40" y="112" font-size="11" font-weight="700" fill="#94a3b8" letter-spacing="1.2">REQUEST PATH</text>

  <rect x="40" y="126" width="150" height="64" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="115" y="152" font-size="13" font-weight="600" fill="#0f172a" text-anchor="middle">tokenize</text>
  <text x="115" y="172" font-size="11" fill="#64748b" text-anchor="middle">CPU</text>

  <rect x="230" y="126" width="170" height="64" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="315" y="152" font-size="13" font-weight="600" fill="#0f172a" text-anchor="middle">prefill</text>
  <text x="315" y="172" font-size="11" fill="#64748b" text-anchor="middle">GEMM · compute-bound</text>

  <rect x="440" y="126" width="180" height="64" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="530" y="152" font-size="13" font-weight="600" fill="#1e40af" text-anchor="middle">decode loop</text>
  <text x="530" y="172" font-size="11" fill="#3b82f6" text-anchor="middle">GEMV · bandwidth-bound</text>

  <rect x="660" y="126" width="150" height="64" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="735" y="152" font-size="13" font-weight="600" fill="#0f172a" text-anchor="middle">sample</text>
  <text x="735" y="172" font-size="11" fill="#64748b" text-anchor="middle">top-k / top-p</text>

  <rect x="850" y="126" width="130" height="64" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="915" y="152" font-size="13" font-weight="600" fill="#0f172a" text-anchor="middle">token</text>
  <text x="915" y="172" font-size="11" fill="#64748b" text-anchor="middle">→ next round</text>

  <line x1="190" y1="158" x2="228" y2="158" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="400" y1="158" x2="438" y2="158" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="620" y1="158" x2="658" y2="158" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="810" y1="158" x2="848" y2="158" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- feedback loop -->
  <path d="M 915 190 L 915 214 L 530 214 L 530 192" fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
  <text x="700" y="230" font-size="10.5" fill="#94a3b8" text-anchor="middle">one token per iteration</text>

  <!-- ============ ROW 2: decode internals ============ -->
  <text x="40" y="278" font-size="11" font-weight="700" fill="#94a3b8" letter-spacing="1.2">DECODE LOOP INTERNALS</text>

  <rect x="40" y="292" width="200" height="70" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="140" y="318" font-size="13" font-weight="600" fill="#1e40af" text-anchor="middle">n-gram draft</text>
  <text x="140" y="338" font-size="11" fill="#3b82f6" text-anchor="middle">no draft model · free</text>
  <text x="140" y="353" font-size="10.5" fill="#60a5fa" text-anchor="middle">lookup in context</text>

  <rect x="280" y="292" width="200" height="70" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="380" y="318" font-size="13" font-weight="600" fill="#1e40af" text-anchor="middle">verify batch</text>
  <text x="380" y="338" font-size="11" fill="#3b82f6" text-anchor="middle">k rows in one pass</text>
  <text x="380" y="353" font-size="10.5" fill="#60a5fa" text-anchor="middle">5.0× amortisation at k=8</text>

  <rect x="520" y="292" width="200" height="70" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="620" y="318" font-size="13" font-weight="600" fill="#1e40af" text-anchor="middle">accept / reject</text>
  <text x="620" y="338" font-size="11" fill="#3b82f6" text-anchor="middle">exact · same distribution</text>
  <text x="620" y="353" font-size="10.5" fill="#60a5fa" text-anchor="middle">verified identical at temp 0</text>

  <rect x="760" y="292" width="200" height="70" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="860" y="318" font-size="13" font-weight="600" fill="#0f172a" text-anchor="middle">fallback</text>
  <text x="860" y="338" font-size="11" fill="#64748b" text-anchor="middle">plain decode</text>
  <text x="860" y="353" font-size="10.5" fill="#94a3b8" text-anchor="middle">when the gate is off</text>

  <line x1="240" y1="327" x2="278" y2="327" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arrow-blue)"/>
  <line x1="480" y1="327" x2="518" y2="327" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arrow-blue)"/>
  <line x1="720" y1="327" x2="758" y2="327" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- ============ ROW 3: the changes ============ -->
  <text x="40" y="418" font-size="11" font-weight="700" fill="#94a3b8" letter-spacing="1.2">CHANGES AND MEASURED EFFECT</text>

  <!-- change cards -->
  <g>
    <rect x="40" y="432" width="270" height="96" rx="8" fill="#ffffff" stroke="#dbeafe" stroke-width="1.5"/>
    <rect x="40" y="432" width="4" height="96" rx="2" fill="#2563eb"/>
    <text x="58" y="456" font-size="12.5" font-weight="700" fill="#0f172a">acceptance gate</text>
    <text x="58" y="476" font-size="11" fill="#475569">rolling acceptance over 16 rounds;</text>
    <text x="58" y="492" font-size="11" fill="#475569">stop drafting below break-even α≈0.6</text>
    <text x="58" y="514" font-size="11.5" font-weight="600" fill="#2563eb">copy 2.6× · chat/code neutral</text>
  </g>

  <g>
    <rect x="330" y="432" width="270" height="96" rx="8" fill="#ffffff" stroke="#dbeafe" stroke-width="1.5"/>
    <rect x="330" y="432" width="4" height="96" rx="2" fill="#2563eb"/>
    <text x="348" y="456" font-size="12.5" font-weight="700" fill="#0f172a">adaptive draft length</text>
    <text x="348" y="476" font-size="11" fill="#475569">k chosen to maximise yield / cost;</text>
    <text x="348" y="492" font-size="11" fill="#475569">slow start at 4 tokens</text>
    <text x="348" y="514" font-size="11.5" font-weight="600" fill="#2563eb">removes −10% chat regression</text>
  </g>

  <g>
    <rect x="620" y="432" width="270" height="96" rx="8" fill="#ffffff" stroke="#dbeafe" stroke-width="1.5"/>
    <rect x="620" y="432" width="4" height="96" rx="2" fill="#2563eb"/>
    <text x="638" y="456" font-size="12.5" font-weight="700" fill="#0f172a">adaptive lookup length</text>
    <text x="638" y="476" font-size="11" fill="#475569">size_n follows draft acceptance;</text>
    <text x="638" y="492" font-size="11" fill="#475569">explores short when nothing matches</text>
    <text x="638" y="514" font-size="11.5" font-weight="600" fill="#2563eb">up to 4.4× on repetitive text</text>
  </g>

  <g>
    <rect x="910" y="432" width="290" height="96" rx="8" fill="#ffffff" stroke="#dbeafe" stroke-width="1.5"/>
    <rect x="910" y="432" width="4" height="96" rx="2" fill="#2563eb"/>
    <text x="928" y="456" font-size="12.5" font-weight="700" fill="#0f172a">output matrix at 4 bits</text>
    <text x="928" y="476" font-size="11" fill="#475569">Q4_0 is legal when hidden % 256 ≠ 0;</text>
    <text x="928" y="492" font-size="11" fill="#475569">Q8_0 fallback was a format artifact</text>
    <text x="928" y="514" font-size="11.5" font-weight="600" fill="#2563eb">−19% bytes · +18.6% decode · +2.9% PPL</text>
  </g>

  <g>
    <rect x="40" y="548" width="270" height="96" rx="8" fill="#ffffff" stroke="#dbeafe" stroke-width="1.5"/>
    <rect x="40" y="548" width="4" height="96" rx="2" fill="#2563eb"/>
    <text x="58" y="572" font-size="12.5" font-weight="700" fill="#0f172a">tokenization</text>
    <text x="58" y="592" font-size="11" fill="#475569">one-pass special-token scan; SPM session</text>
    <text x="58" y="608" font-size="11" fill="#475569">reused across fragments</text>
    <text x="58" y="630" font-size="11.5" font-weight="600" fill="#2563eb">1.5× · byte-identical output</text>
  </g>

  <g>
    <rect x="330" y="548" width="270" height="96" rx="8" fill="#ffffff" stroke="#dbeafe" stroke-width="1.5"/>
    <rect x="330" y="548" width="4" height="96" rx="2" fill="#2563eb"/>
    <text x="348" y="572" font-size="12.5" font-weight="700" fill="#0f172a">sequential readahead</text>
    <text x="348" y="592" font-size="11" fill="#475569">macOS had no fadvise; decode walks</text>
    <text x="348" y="608" font-size="11" fill="#475569">weights in layer order</text>
    <text x="348" y="630" font-size="11.5" font-weight="600" fill="#2563eb">neutral resident · helps out-of-RAM</text>
  </g>

  <g>
    <rect x="620" y="548" width="270" height="96" rx="8" fill="#ffffff" stroke="#dbeafe" stroke-width="1.5"/>
    <rect x="620" y="548" width="4" height="96" rx="2" fill="#2563eb"/>
    <text x="638" y="572" font-size="12.5" font-weight="700" fill="#0f172a">prefill ubatch</text>
    <text x="638" y="592" font-size="11" fill="#475569">weights are re-read per chunk; a more</text>
    <text x="638" y="608" font-size="11" fill="#475569">generous ubatch amortises them further</text>
    <text x="638" y="630" font-size="11.5" font-weight="600" fill="#2563eb">pp2048 1477 → 1696 tok/s</text>
  </g>

  <g>
    <rect x="910" y="548" width="290" height="96" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
    <rect x="910" y="548" width="4" height="96" rx="2" fill="#94a3b8"/>
    <text x="928" y="572" font-size="12.5" font-weight="700" fill="#0f172a">not changed</text>
    <text x="928" y="592" font-size="11" fill="#475569">matvec kernel, KV cache, activation</text>
    <text x="928" y="608" font-size="11" fill="#475569">traffic — measured at their ceiling</text>
    <text x="928" y="630" font-size="11.5" font-weight="600" fill="#64748b">see docs/PERF_NOTES.md</text>
  </g>

  <!-- ============ ROW 4: the roofline ============ -->
  <text x="40" y="690" font-size="11" font-weight="700" fill="#94a3b8" letter-spacing="1.2">WHERE THE TIME GOES</text>

  <rect x="40" y="704" width="1160" height="76" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="60" y="728" font-size="12" fill="#334155">Decode is bandwidth-bound: 618 MB/token at 100 tok/s = 61.8 GB/s, ~31% of the 200 GB/s spec peak and ~41% of achievable.</text>
  <text x="60" y="748" font-size="12" fill="#334155">A CPU profile shows the main thread in __psynch_cvwait 51,341 samples vs 32 in set_logits — the CPU is idle waiting on the GPU.</text>
  <text x="60" y="768" font-size="12" fill="#334155">So the remaining headroom is GPU-side (1.3–1.6×, needs a dispatch rewrite), and the only lever that changes bytes/token is speculation.</text>
</svg>
